<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:; object-src 'none'">
  <title>Burg Vector</title><link rel="stylesheet" href="panel.css">
</head>
<body>
<main>
  <header><h1>Burg Vector</h1><button id="capture" type="button">Use selection</button></header>
  <label class="section-title" for="effect">Effect</label>
  <select id="effect"></select>
  <div class="stage">
    <svg id="preview" aria-label="Effect preview" role="img" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="stage-bar"><span id="source">Sample artwork</span><button id="compare" aria-pressed="false" type="button">Show original</button></div>
  </div>
  <div class="preset-row"><label for="preset">Preset</label><select id="preset"></select><button id="vary" type="button" title="Preview a small variation of these settings">Vary</button><button id="save" type="button" title="Save the current settings for this effect">Save</button></div>
  <div id="controls"></div>
</main>
<footer>
  <div class="placement"><label for="placement">Create result</label><select id="placement"><option value="beside">Beside original</option><option value="above">Over original</option></select></div>
  <button id="apply" type="button" disabled>Create vector artwork</button>
  <div id="status" role="status" aria-live="polite">Select artwork in Illustrator to apply the effect.</div>
</footer>
<script src="vendor/clipper.js"></script><script src="catalog.js"></script><script src="geometry.js"></script>
<script src="path-effects.js"></script><script src="effects.js"></script><script src="panel.js"></script>
</body></html>
